[project]
name = "udacity-ai-security-engineer"
version = "0.1.0"
description = "AI security engineer coursework and harness tooling"
readme = "README.md"
authors = [
    { name = "Samuel H.Mariam", email = "samhmariam@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "adversarial-robustness-toolbox==1.20.1",
    "boto3>=1.38.0",
    "faiss-cpu>=1.8",
    "ipykernel==7.3.0",
    "matplotlib==3.11.0",
    "nbconvert==7.17.1",
    "numpy==2.5.0",
    "openai==2.44.0",
    "pillow==12.2.0",
    "python-dotenv>=1.0.1",
    "scikit-learn==1.8.0",
    "torch==2.5.1",
    "torchvision==0.20.1",
]

[project.scripts]
udacity-ai-security-engineer = "udacity_ai_security_engineer:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
